name: ml

on:
  schedule:
    - cron: "17 7 * * *" # nightly, off the top of the hour
  workflow_dispatch:
  repository_dispatch:
    types: [profile-updated]

concurrency:
  group: ml
  cancel-in-progress: false

permissions:
  contents: read
  actions: write # keepalive: lets the job re-enable its own schedule

jobs:
  ml:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: ml/uv.lock

      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-bge-small-en-v1.5

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest

      - name: Fetch pending job descriptions
        env:
          CONVEX_SITE_URL: ${{ secrets.CONVEX_SITE_URL }}
          ML_SHARED_SECRET: ${{ secrets.ML_SHARED_SECRET }}
        run: uv run python -m intern_radar_ml jd

      - name: Embed pending listings and resumes
        env:
          CONVEX_SITE_URL: ${{ secrets.CONVEX_SITE_URL }}
          ML_SHARED_SECRET: ${{ secrets.ML_SHARED_SECRET }}
          FASTEMBED_CACHE_PATH: ~/.cache/fastembed
        run: uv run python -m intern_radar_ml embed

      - name: Train and push a model version
        env:
          CONVEX_SITE_URL: ${{ secrets.CONVEX_SITE_URL }}
          ML_SHARED_SECRET: ${{ secrets.ML_SHARED_SECRET }}
        run: uv run python -m intern_radar_ml train

      # Public-repo scheduled workflows are auto-disabled after 60 days
      # without repo activity; re-enabling ourselves on every run resets that.
      - name: Keepalive
        if: always()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT \
            "/repos/${{ github.repository }}/actions/workflows/ml.yml/enable" \
            || echo "keepalive re-enable failed (non-fatal)"
