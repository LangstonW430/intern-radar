[project]
name = "intern-radar-ml"
version = "0.1.0"
description = "JD fetching and embedding for intern-radar"
readme = "README.md"
authors = [
    { name = "langston", email = "langstonw430@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.8.1",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
